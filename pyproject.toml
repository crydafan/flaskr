[project]
name = "flaskr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leonardo", email = "leonardo.estacio.h@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "ruff>=0.16.8",
]

[project.scripts]
flaskr = "flaskr:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "djlint>=1.46.1",
]
